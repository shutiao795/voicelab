<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoiceLab 实时变声实验室</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1320;color:#eaf0ff}main{max-width:650px;margin:auto;padding:24px 18px 50px}h1{margin:0;font-size:28px}p{color:#aebbd1;line-height:1.6}.card{background:#182237;border:1px solid #30405d;border-radius:20px;padding:18px;margin:16px 0}button,select,a{border:1px solid #5a79b4;border-radius:12px;padding:12px;background:#253c68;color:white;font-size:15px;cursor:pointer}button:disabled{opacity:.45}button.primary{background:#6c8df5;color:#0b1220;font-weight:700}.buttons{display:flex;flex-wrap:wrap;gap:9px}.slider{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}input[type=range]{width:100%;accent-color:#92b0ff}output{font-variant-numeric:tabular-nums;color:#bcd1ff}label{font-weight:600}.small{font-size:13px;color:#9cacc6}#status{padding:12px;background:#202e45;border-radius:12px;min-height:46px}audio{width:100%;margin-top:10px}a{display:inline-block;text-decoration:none;margin-top:10px}#level{width:100%;height:8px;background:#34445e;border-radius:10px;overflow:hidden}#meter{width:0%;height:100%;background:#80d4b3;transition:width .1s}.notice{border-left:3px solid #edc37b;padding-left:12px}</style></head><body><main>
<h1>🎙️ VoiceLab</h1><p>手机浏览器实时变声实验室 · 第一版</p><div class="card"><h2>实时监听</h2><p class="notice">建议佩戴耳机，并先把音量调低。使用手机扬声器外放可能产生尖锐啸叫。蓝牙耳机可能有明显延迟。</p><div class="buttons"><button class="primary" id="start">启动麦克风</button><button id="stop" disabled>停止</button><button id="record" disabled>开始录音</button></div><p id="status" role="status">未启动。需要 HTTPS 网页环境与麦克风授权。</p><div id="level"><div id="meter"></div></div></div>
<div class="card"><h2>音色调节</h2><p class="small">本原型的音高是变速式变调：会同时改变说话速度。真正独立的音高和共振峰算法留待后续升级。</p><div class="slider"><label for="pitch">音高 / 速度</label><output id="pitchOut">0 st</output></div><input id="pitch" type="range" min="-5" max="5" step="1" value="0"><div class="slider"><label for="bass">低频</label><output id="bassOut">0 dB</output></div><input id="bass" type="range" min="-12" max="12" step="1" value="0"><div class="slider"><label for="bright">明亮度</label><output id="brightOut">0 dB</output></div><input id="bright" type="range" min="-12" max="12" step="1" value="0"><div class="slider"><label for="gain">输出音量</label><output id="gainOut">50%</output></div><input id="gain" type="range" min="0" max="100" step="1" value="50"><h3>预设</h3><div class="buttons"><button data-preset="natural">原声</button><button data-preset="deep">低沉</button><button data-preset="bright">清亮</button><button data-preset="robot">机械感</button></div></div>
<div class="card"><h2>录音试听</h2><p class="small">录制处理后的声音，停止后可以播放或保存。录音格式取决于浏览器支持。</p><audio id="playback" controls></audio><div id="download"></div></div><p class="small">隐私：音频只在当前设备浏览器中处理，不上传服务器。刷新页面会停止监听。不能将变声作为其他游戏或通话软件的麦克风。</p></main>
<script>
const $=id=>document.getElementById(id);let ctx,stream,source,processor,low,high,gain,analyser,mediaDest,recorder,chunks=[],url,monitor=false,phase=0,history=new Float32Array(16384),historyPos=0;let playing=false;
function status(s){$('status').textContent=s}function vals(){let p=+$('pitch').value,b=+$('bass').value,t=+$('bright').value,g=+$('gain').value;$('pitchOut').textContent=p+' st';$('bassOut').textContent=b+' dB';$('brightOut').textContent=t+' dB';$('gainOut').textContent=g+'%';if(low)low.gain.value=b;if(high)high.gain.value=t;if(gain)gain.gain.value=g/100;}['pitch','bass','bright','gain'].forEach(id=>$(id).addEventListener('input',vals));
const presets={natural:[0,0,0,50],deep:[-3,5,-3,50],bright:[3,-3,5,50],robot:[-5,-2,7,40]};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{['pitch','bass','bright','gain'].forEach((id,i)=>$(id).value=presets[b.dataset.preset][i]);vals()});
async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('当前页面无法调用麦克风。请使用 HTTPS 网站打开，而不是直接打开本地文件。');$('start').disabled=true;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=260;high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=2500;gain=ctx.createGain();analyser=ctx.createAnalyser();analyser.fftSize=1024;mediaDest=ctx.createMediaStreamDestination();source.connect(processor);processor.connect(low);low.connect(high);high.connect(gain);gain.connect(analyser);analyser.connect(mediaDest);analyser.connect(ctx.destination);processor.onaudioprocess=e=>{const inp=e.inputBuffer.getChannelData(0),out=e.outputBuffer.getChannelData(0),ratio=Math.pow(2,Number($('pitch').value)/12);for(let i=0;i<inp.length;i++){history[historyPos]=inp[i];historyPos=(historyPos+1)%history.length;let read=(historyPos-2048+phase+history.length*4)%history.length;let ix=Math.floor(read),f=read-ix;out[i]=(history[ix]*(1-f)+history[(ix+1)%history.length]*f)*.7;phase+=ratio;if(phase>=2048)phase-=2048;} };vals();playing=true;$('stop').disabled=false;$('record').disabled=false;status('正在监听：请轻声测试，音量不要过大。');meter();}catch(err){status('启动失败：'+err.message);stop()}}
function meter(){if(!playing)return;let a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(a);let sum=0;for(const v of a)sum+=((v-128)/128)**2;$('meter').style.width=Math.min(100,Math.sqrt(sum/a.length)*200)+'%';requestAnimationFrame(meter)}
function stop(){playing=false;if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stream=null;try{processor?.disconnect();source?.disconnect();ctx?.close()}catch(e){}ctx=null;processor=null;low=null;high=null;gain=null;$('start').disabled=false;$('stop').disabled=true;$('record').disabled=true;$('meter').style.width='0%';status('已停止监听。')}
$('start').onclick=start;$('stop').onclick=stop;$('record').onclick=()=>{if(!mediaDest)return;if(recorder?.state==='recording'){recorder.stop();$('record').textContent='开始录音';return}if(!window.MediaRecorder){status('当前浏览器不支持录音导出');return}chunks=[];try{recorder=new MediaRecorder(mediaDest.stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('playback').src=url;const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';$('download').innerHTML='';const a=document.createElement('a');a.href=url;a.download='voicelab-recording.'+ext;a.textContent='保存变声录音';$('download').appendChild(a);status('录音已生成，可播放或保存。')};recorder.start();$('record').textContent='结束录音';status('正在录音……')}catch(e){status('录音失败：'+e.message)}};window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop())});vals();
</script></body></html>
